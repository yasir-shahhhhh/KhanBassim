    <style>
        :root { --accent: #b66bff; }
        body, html { margin: 0; padding: 0; overflow-x: hidden; background: #02030b; }
        
        #preloader {
            position: fixed; inset: 0; z-index: 9999;
            background: #02030b;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }
        .loader-ring {
            width: 60px; height: 60px;
            border: 2px solid rgba(182, 107, 255, 0.1);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loader-text {
            margin-top: 20px; color: rgba(255,255,255,0.4);
            font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase;
            font-family: 'Inter', sans-serif;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #preloader.fade-out { opacity: 0; visibility: hidden; }

        #hero { 
            position: relative; height: 100vh; width: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 10; overflow: hidden;
        }
        #hero-video { 
            position: absolute; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 0; 
            filter: saturate(1.1) brightness(0.45); 
            transition: transform 8s ease-out;
        }
        #hero:hover #hero-video { transform: scale(1.05); }
        
        #hero-video-overlay { 
            position: absolute; inset: 0; z-index: 1;
            background: radial-gradient(circle at center, transparent 0%, rgba(2, 3, 11, 0.4) 100%);
        }
        
        #hero-content { 
            text-align: center; z-index: 2; padding: 40px; 
            animation: heroEnter 1.2s cubic-bezier(0.2, 0, 0.2, 1) both;
        }
        
        @keyframes heroEnter {
            from { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        #hero-title { 
            font-size: clamp(3rem, 8vw, 6rem); font-weight: 800; 
            line-height: 0.9; margin-bottom: 20px; 
            color: #ffffff;
            letter-spacing: -0.04em;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        #hero-sub { 
            font-size: clamp(1rem, 2.5vw, 1.4rem); 
            color: rgba(255,255,255,0.7); font-weight: 400; 
            height: 30px; margin-bottom: 50px; 
            letter-spacing: 0.05em;
        }
        .typewriter-cursor { color: var(--accent); animation: blink 1s step-end infinite; }
        
        .navbar { opacity: 0; transform: translateX(-50%) translateY(-20px); transition: all 0.8s ease 1s; }
        .navbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .hero-buttons .btn {
            padding: 16px 40px; font-size: 0.95rem;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .hero-buttons .btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
