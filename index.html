        #preloader {

            font-family: 'Inter', sans-serif;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #preloader.fade-out { opacity: 0; visibility: hidden; }

        #hero { 
            position: relative; height: 100vh; width: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 10; overflow: hidden;
        }
        #hero-video { 
            position: absolute; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 0; 
            filter: saturate(1.1) brightness(0.45); 
            transition: transform 8s ease-out;
        }
        #hero:hover #hero-video { transform: scale(1.05); }
        
        #hero-video-overlay { 
            position: absolute; inset: 0; z-index: 1;
            background: radial-gradient(circle at center, transparent 0%, rgba(2, 3, 11, 0.4) 100%);
        }
        
        #hero-content { 
            text-align: center; z-index: 2; padding: 40px; 
        }

        /* Smash-in animation system: elements start way off and slam into place */
        .hero-snap-item {
            opacity: 0;
            transform: translateY(80px) scale(0.6) rotate(-2deg);
            filter: blur(12px);
            transition: none;
        }
        .hero-snap-item.snapped {
            opacity: 1;
            transform: translateY(0) scale(1) rotate(0deg);
            filter: blur(0);
            animation: smashIn 0.35s cubic-bezier(0.22, 1.8, 0.36, 1) both;
        }

        /* Dust-out when leaving tab */
        .hero-snap-item.dust-out {
            animation: dustOut 0.25s cubic-bezier(0.55, 0, 1, 0.45) both;
        }

        /* Screen shake on impact */
        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            15% { transform: translate(-3px, 2px); }
            30% { transform: translate(4px, -2px); }
            45% { transform: translate(-2px, 3px); }
            60% { transform: translate(2px, -1px); }
            75% { transform: translate(-1px, 1px); }
            100% { transform: translate(0, 0); }
        }

        #hero-content.impact-shake {
            animation: screenShake 0.25s ease-out;
        }

        @keyframes smashIn {
            0% { 
                opacity: 0; 
                transform: translateY(80px) scale(0.6) rotate(-2deg); 
                filter: blur(12px); 
            }
            50% { 
                opacity: 1; 
                transform: translateY(-8px) scale(1.06) rotate(0.5deg); 
                filter: blur(0); 
            }
            70% { 
                transform: translateY(3px) scale(0.98) rotate(-0.3deg); 
            }
            85% { 
                transform: translateY(-1px) scale(1.01) rotate(0deg); 
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1) rotate(0deg); 
                filter: blur(0); 
            }
        }

        @keyframes dustOut {
            0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); filter: blur(0); }
            100% { opacity: 0; transform: translateY(-40px) scale(0.7) rotate(3deg); filter: blur(14px); }
        }

        @keyframes blink { 50% { opacity: 0; } }

        #hero-title { 
            font-family: var(--font-display);
            font-size: clamp(3.5rem, 8.5vw, 6.8rem); font-weight: 300;

    <script>
    // HERO SMASH-IN SEQUENCE CONTROLLER
    (function() {
        const SMASH_DELAY = 180;  // ms between each element slamming in
        const INITIAL_WAIT = 500; // ms after page load before first smash

        function getSnapItems() {
            return document.querySelectorAll('.hero-snap-item');
        }

        function triggerShake() {
            const heroContent = document.getElementById('hero-content');
            if (!heroContent) return;
            heroContent.classList.remove('impact-shake');
            void heroContent.offsetWidth;
            heroContent.classList.add('impact-shake');
            setTimeout(() => heroContent.classList.remove('impact-shake'), 300);
        }

        function runSmashSequence() {
            const items = getSnapItems();
            items.forEach((item, i) => {
                item.classList.remove('snapped', 'dust-out');
                void item.offsetWidth;
                setTimeout(() => {
                    item.classList.add('snapped');
                    // Shake screen on the title slam (first element)
                    if (i === 0) triggerShake();
                }, INITIAL_WAIT + (i * SMASH_DELAY));
            });
        }

        function dustOutAndReplay() {
            const items = getSnapItems();
            items.forEach(item => {
                item.classList.remove('snapped');
                item.classList.add('dust-out');
            });
            setTimeout(() => {
                items.forEach(item => {
                    item.classList.remove('dust-out');
                    void item.offsetWidth;
                });
                runSmashSequence();
            }, 350);
        }

        // Initial snap sequence on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runSmashSequence);
        } else {
            runSmashSequence();
        }

        // Tab visibility: dust out when leaving, snap back when returning
        document.addEventListener('visibilitychange', () => {
            if (!document.body.classList.contains('hero-mode')) return;
            if (document.visibilityState === 'visible') {
                dustOutAndReplay();
            }
        });
    })();
    </script>
