        body, html { margin: 0; padding: 0; height: auto; min-height: 100%; overflow-x: hidden; background: var(--bg-primary); scroll-behavior: smooth; }
        #hero { position: relative; height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .hero-aurora { position: absolute; inset: 0; overflow: hidden; z-index: -1; background: radial-gradient(circle at 50% 50%, rgba(20, 20, 25, 1) 0%, #050505 100%); }

        .ha-orb-1 { width: 300px; height: 300px; background: rgba(255, 255, 255, 0.1); top: 20%; left: 30%; }
        .ha-orb-2 { width: 400px; height: 400px; background: rgba(160, 160, 170, 0.05); bottom: 10%; right: 20%; }
        #hero-content { text-align: center; z-index: 2; padding: 20px; }
        #hero-label { font-size: 0.8rem; letter-spacing: 0.3em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 20px; animation: fadeIn 1s ease 0.5s both; }
        #hero-title { font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 700; line-height: 1.1; margin-bottom: 15px; color: var(--text-primary); animation: fadeIn 1s ease 0.7s both; }
        #hero-title .highlight { color: #a1a1aa; }
        #hero-sub { font-size: clamp(1rem, 2.5vw, 1.5rem); color: var(--text-secondary); font-weight: 300; height: 30px; margin-bottom: 40px; animation: fadeIn 1s ease 0.9s both; }
        .typewriter-cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        #explore-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-primary); padding: 15px 30px; font-size: 1rem; border-radius: 30px; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-main); animation: fadeIn 1s ease 1.1s both; }
        #explore-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--border-color-light); transform: translateY(-3px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Logo Reveal Styles */
        .logo-section { padding: 100px 5%; background: var(--bg-primary); position: relative; z-index: 20; }

    <script>
        lucide.createIcons();
        
        function toggleLogo(id) {
            const details = document.getElementById(id);
            document.querySelectorAll('.logo-details').forEach(d => {
                if(d.id !== id) d.classList.remove('active');
            });
            details.classList.toggle('active');
        }

        // Hero Mouse Effect
        const orb1 = document.getElementById('orb-1');
        const orb2 = document.getElementById('orb-2');
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            orb1.style.transform = `translate(${x * 50}px, ${y * 50}px)`;
            orb2.style.transform = `translate(${x * -80}px, ${y * -80}px)`;
        });

        // Typewriter Effect
        const phrases = ["Building Systems.", "Leading Operations.", "Executing Vision.", "Designing Content."];
        let i = 0; let j = 0; let current = ""; let isDeleting = false;
        function type() {
            const full = phrases[i % phrases.length];
            if (isDeleting) { current = full.substring(0, j - 1); j--; }
            else { current = full.substring(0, j + 1); j++; }
            document.getElementById('typewriter').textContent = current;
            let speed = isDeleting ? 50 : 100;
            if (!isDeleting && j === full.length) { speed = 2000; isDeleting = true; }
            else if (isDeleting && j === 0) { isDeleting = false; i++; speed = 500; }
            setTimeout(type, speed);
        }
        type();
    </script>
