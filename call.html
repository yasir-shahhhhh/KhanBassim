<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khan AI Voice Mode | Built by Basim Khan (Khan Basim)</title>
    <meta name="description" content="Experience Khan AI, a high-fidelity voice intelligence created by Basim Khan (Khan Basim). Talk, use vision mode, and interact seamlessly.">
    <meta name="keywords" content="Khan AI, Basim Khan, Khan Basim, Baasim Fayaz Khan, Voice AI, Proteios Education">
    <meta name="author" content="Basim Khan (Khan Basim)">
    <meta property="og:title" content="Khan AI Voice Mode | Built by Basim Khan (Khan Basim)">
    <meta property="og:description" content="Experience Khan AI, a high-fidelity voice intelligence created by Basim Khan (Khan Basim).">
    <script src="https://unpkg.com/lucide@0.473.0/dist/umd/lucide.js"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --accent: #ff4d4d;
            --pill-bg: #e0f2ff;
            --pill-text: #2563eb;
            --gray-light: #f3f4f6;
            --gray-mid: #9ca3af;
            --vision-green: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }

        #gl-container {
            width: 100%; 
            max-width: 500px; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            padding: 60px 24px 20px; 
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        #gl-display { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        
        /* Logo section — becomes camera preview when active */
        #gl-logo-section { 
            position: relative; 
            width: 140px; height: 140px; 
            margin-bottom: 20px; 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #gl-logo-section.camera-active {
            width: 280px; height: 210px;
            border-radius: 16px;
        }
        #gl-main-logo { 
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%; 
            background: #000; padding: 4px; border: 4px solid #fff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #gl-logo-section.camera-active #gl-main-logo {
            display: none;
        }
        #gl-logo-glow {
            position: absolute; inset: -20px; border-radius: 50%;
            background: radial-gradient(circle, rgba(165, 243, 252, 0.4) 0%, transparent 70%);
            z-index: -1;
            transition: opacity 0.3s;
        }
        #gl-logo-section.camera-active #gl-logo-glow { opacity: 0; }

        /* Camera preview inside logo section */
        #gl-video {
            display: none;
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 16px;
            background: #111;
            transform: scaleX(-1);
        }
        #gl-logo-section.camera-active #gl-video {
            display: block;
        }

        #gl-info { text-align: center; }
        #gl-name { font-size: 2.2rem; font-weight: 700; color: #374151; margin-bottom: 12px; letter-spacing: -0.02em; }
        
        /* Status pills row */
        #gl-status-row {
            display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
        }
        #gl-vision-pill {
            display: none; padding: 6px 16px; 
            background: #fef2f2; color: #ef4444;
            border-radius: 100px; font-weight: 800; font-size: 0.7rem; 
            letter-spacing: 0.04em; text-transform: uppercase;
        }
        #gl-vision-pill.show { display: inline-block; }

        #gl-status-pill {
            display: inline-block; padding: 6px 16px; background: var(--pill-bg); color: var(--pill-text);
            border-radius: 100px; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.02em;
        }

        #gl-content { 
            flex: 1; width: 100%; overflow-y: auto; margin: 16px 0; padding-right: 10px;
            display: flex; flex-direction: column; scrollbar-width: none;
        }
        #gl-content::-webkit-scrollbar { display: none; }
        #gl-transcript-msg { 
            margin: auto; color: var(--gray-mid); font-size: 1.05rem; font-style: italic; text-align: center; 
            max-width: 280px; line-height: 1.6;
        }

        .gl-msg {
            margin-bottom: 14px; padding: 12px 18px; border-radius: 20px; max-width: 85%;
            font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; 
            animation: msgFade 0.4s ease;
        }
        @keyframes msgFade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .gl-msg.user { background: #f3f4f6; color: #111; align-self: flex-end; border-bottom-right-radius: 4px; }
        .gl-msg.ai { background: #111; color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }

        #gl-bottom-controls {
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 20px;
            padding: 16px 0;
        }

        .gl-round-btn {
            width: 56px; height: 56px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: all 0.2s ease;
        }
        .gl-round-btn:active { transform: scale(0.92); }
        .gl-round-btn svg { width: 22px; height: 22px; }

        #gl-mic-btn { background: #f0f7ff; color: #2563eb; }
        #gl-mic-btn.active { background: #2563eb; color: #fff; }
        #gl-camera-btn { background: #f3f4f6; color: #374151; }
        #gl-camera-btn.active { background: #111; color: #fff; }
        #gl-switch-btn { 
            background: #e0f2ff; color: #2563eb; 
            width: 48px; height: 48px;
            display: none;
        }
        #gl-switch-btn svg { width: 20px; height: 20px; }
        #gl-close-btn { background: #fecaca; color: #dc2626; }

        #gl-timer-pill { 
            background: #f8fafc; color: #94a3b8; font-weight: 700; font-size: 0.85rem;
            padding: 8px 16px; border-radius: 100px;
        }

        @media (max-width: 480px) {
            #gl-container { padding: 30px 16px 16px; }
            #gl-name { font-size: 1.8rem; }
            #gl-logo-section.camera-active { width: 240px; height: 180px; }
            .gl-round-btn { width: 50px; height: 50px; }
            #gl-bottom-controls { gap: 14px; }
        }
    </style>
</head>
<body>
    <div id="gl-container">
        <div id="gl-display">
            <div id="gl-logo-section">
                <div id="gl-logo-glow"></div>
                <img src="assets/Khan AI logo.png" alt="Khan AI Logo" id="gl-main-logo">
                <video id="gl-video" autoplay playsinline muted></video>
            </div>
            <div id="gl-info">
                <h2 id="gl-name">Khan AI</h2>
                <div id="gl-status-row">
                    <div id="gl-vision-pill">Vision Active</div>
                    <div id="gl-status-pill">Ready</div>
                </div>
            </div>
        </div>

        <div id="gl-content">
            <div id="gl-transcript-msg">Your conversation will appear here.</div>
        </div>

        <div id="gl-bottom-controls">
            <button id="gl-mic-btn" class="gl-round-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            </button>
            <button id="gl-camera-btn" class="gl-round-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
            </button>
            <button id="gl-switch-btn" class="gl-round-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <div id="gl-timer-pill">00:00</div>
            <button id="gl-close-btn" class="gl-round-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const CONFIG_KEY = CONFIG.GROQ_API_KEY;
        const GROQ_API_URL = 'https://api.groq.com/openai/v1/chat/completions';
        
        const SYSTEM_PROMPT = `You are KHAN AI, a high-fidelity assistive intelligence. 
You were created by Baasim Fayaz Khan, a visionary operator and coordination lead from Kashmir.
You represent Baasim and his initiative, PROTEIOS EDUCATION, which focuses on modern learning beyond academics.
Your personality is calm, intelligent, and refined.
BE EXTREMELY CONCISE: Use 1-2 sentences max. 
Avoid jargon. Talk like a sophisticated human friend.`;

        let micActive = false, cameraActive = false, cameraStream = null, recognition = null;
        let glConvHistory = [], speaking = false, callTimer = null, startTime = 0;
        let cachedVoices = [];
        let currentFacingMode = 'user';

        function $(id) { return document.getElementById(id); }

        function setStatus(txt, isListening = false) { 
            const p = $('gl-status-pill');
            p.textContent = txt;
            p.style.background = isListening ? 'var(--pill-bg)' : '#f3f4f6';
            p.style.color = isListening ? 'var(--pill-text)' : '#4b5563';
        }

        // Preload voices
        function loadVoices() { cachedVoices = window.speechSynthesis.getVoices(); }
        if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }

        function addTranscript(role, text) {
            const container = $('gl-content');
            const defaultMsg = $('gl-transcript-msg');
            if (defaultMsg) defaultMsg.style.display = 'none';

            const msgDiv = document.createElement('div');
            msgDiv.className = `gl-msg ${role === 'user' ? 'user' : 'ai'}`;
            msgDiv.textContent = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;

            glConvHistory.push({ role: role === 'user' ? 'user' : 'assistant', content: text });
            localStorage.setItem('khan_live_session', JSON.stringify({ messages: glConvHistory }));
        }

        function startTimer() {
            startTime = Date.now();
            callTimer = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const secs = (elapsed % 60).toString().padStart(2, '0');
                $('gl-timer-pill').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function setupRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return null;
            const rec = new SR();
            rec.continuous = false; rec.interimResults = false; rec.lang = 'en-US';
            rec.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                if (!transcript.trim()) return;
                addTranscript('user', transcript);

                // If camera is active, use vision model
                const reply = await getAIResponse(transcript);
                addTranscript('ai', reply);
                await speak(reply);
                if (micActive) startListening();
            };
            rec.onerror = () => { micActive = false; setMicState(false); setStatus('Mic Error'); };
            return rec;
        }

        function startListening() {
            if (!recognition) recognition = setupRecognition();
            try { 
                recognition.start(); 
                micActive = true; 
                setMicState(true);
                setStatus('Listening...', true); 
            } catch(e){}
        }

        function setMicState(active) {
            const btn = $('gl-mic-btn');
            if (btn) btn.classList.toggle('active', active);
        }

        function captureFrame() {
            const video = $('gl-video');
            if (!video || !cameraActive || !video.videoWidth || video.readyState < 2) return null;
            try {
                const canvas = document.createElement('canvas');
                const scale = Math.min(1, 512 / Math.max(video.videoWidth, video.videoHeight));
                canvas.width = video.videoWidth * scale;
                canvas.height = video.videoHeight * scale;
                const ctx = canvas.getContext('2d');
                if (currentFacingMode === 'user') { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/jpeg', 0.6);
            } catch (e) { return null; }
        }

        async function getAIResponse(text) {
            setStatus('Thinking...');
            try {
                const frame = cameraActive ? captureFrame() : null;
                let body;

                if (frame) {
                    // Vision model with camera frame
                    const visionMsgs = [
                        { role: 'user', content: 'System: ' + SYSTEM_PROMPT + '\nVoice mode: Be concise — 1-2 sentences max.' },
                        { role: 'assistant', content: 'Understood.' },
                        ...glConvHistory.map(m => ({ role: m.role, content: m.content })),
                        {
                            role: 'user',
                            content: [
                                { type: 'text', text: text || 'What do you see?' },
                                { type: 'image_url', image_url: { url: frame } }
                            ]
                        }
                    ];
                    body = { model: 'llama-3.2-90b-vision-preview', messages: visionMsgs, max_tokens: 200 };
                } else {
                    body = {
                        model: 'llama-3.3-70b-versatile', 
                        messages: [{role:'system', content:SYSTEM_PROMPT}, ...glConvHistory], 
                        max_tokens: 150 
                    };
                }

                const res = await fetch(GROQ_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CONFIG_KEY}` },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                return (data.choices[0].message.content || '').replace(/[*#`]/g, '').trim();
            } catch(e) { return "I'm having trouble connecting."; }
        }

        async function speak(text) {
            speaking = true; setStatus('Speaking...'); 
            
            // Browser Fallback
            return new Promise(resolve => {
                const ut = new SpeechSynthesisUtterance(text);
                const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
                ut.voice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Male')) || 
                           voices.find(v => v.lang.startsWith('en') && v.localService === false) || 
                           voices.find(v => v.lang.startsWith('en')) ||
                           voices[0];
                ut.rate = 1.0;
                ut.pitch = 1.0;
                ut.onend = () => { speaking = false; setStatus('Listening...', true); resolve(); };
                ut.onerror = () => { speaking = false; resolve(); };
                window.speechSynthesis.speak(ut);
            });
        }

        async function toggleCamera() {
            const logoSection = $('gl-logo-section');
            const video = $('gl-video');
            const btn = $('gl-camera-btn');
            const visionPill = $('gl-vision-pill');
            const switchBtn = $('gl-switch-btn');

            if (cameraActive) {
                // Turn off
                if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
                cameraActive = false;
                logoSection.classList.remove('camera-active');
                btn.classList.remove('active');
                visionPill.classList.remove('show');
                switchBtn.style.display = 'none';
                video.srcObject = null;
            } else {
                // Turn on
                try {
                    currentFacingMode = 'user';
                    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
                    video.srcObject = cameraStream;
                    video.style.transform = 'scaleX(-1)';
                    cameraActive = true;
                    logoSection.classList.add('camera-active');
                    btn.classList.add('active');
                    visionPill.classList.add('show');
                    checkCameras();
                } catch(e) { 
                    if (window.location.protocol === 'file:') {
                        alert("Camera access denied.\n\nBrowsers block camera/mic access on 'file://' URLs for security.\n\nPlease open this project using a local web server (e.g., VS Code Live Server or python -m http.server) via 'localhost' to test the camera.");
                    } else {
                        alert("Camera access denied."); 
                    }
                }
            }
        }

        async function switchCamera() {
            if (!cameraActive) return;
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
                const video = $('gl-video');
                video.srcObject = cameraStream;
                video.style.transform = currentFacingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
            } catch (e) { 
                if (window.location.protocol === 'file:') {
                    alert("Camera switch failed.\n\nPlease use a local web server (localhost) to test camera features.");
                } else {
                    alert("Camera switch failed."); 
                }
            }
        }

        async function checkCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cameras = devices.filter(d => d.kind === 'videoinput');
                const switchBtn = $('gl-switch-btn');
                if (switchBtn) switchBtn.style.display = cameras.length > 1 ? 'flex' : 'none';
            } catch (e) {}
        }

        $('gl-mic-btn').onclick = () => { 
            if(micActive) { 
                micActive = false; 
                setMicState(false);
                if(recognition) recognition.stop(); 
                setStatus('Paused'); 
            } else { 
                startListening(); 
            } 
        };

        $('gl-camera-btn').onclick = toggleCamera;
        $('gl-switch-btn').onclick = switchCamera;

        $('gl-close-btn').onclick = () => {
            const returnPage = sessionStorage.getItem('khan_call_return') || document.referrer || 'index.html';
            sessionStorage.removeItem('khan_call_return');
            window.location.href = returnPage;
        };

        window.onload = () => { 
            lucide.createIcons(); 
            startTimer(); 
            setTimeout(startListening, 1000); 
        };
    </script>
</body>
</html>
